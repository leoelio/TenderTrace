name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: node --check web/dist/app.js
      - run: npm ci
        working-directory: integrations/feishu-record-view/opportunity-view
      - run: npm audit --omit=dev
        working-directory: integrations/feishu-record-view/opportunity-view
      - run: npm run typecheck
        working-directory: integrations/feishu-record-view/opportunity-view
      - run: npm run build
        working-directory: integrations/feishu-record-view/opportunity-view
