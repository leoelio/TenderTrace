[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tendertrace"
version = "0.1.0"
description = "TenderTrace multi-source tender intelligence aggregation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pypdf>=4.3",
  "openpyxl>=3.1",
  "playwright>=1.45",
  "cryptography>=42",
  "apscheduler>=3.10",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "jieba>=0.42",
  "selectolax>=0.3",
  "trafilatura>=1.12",
  "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "reportlab>=4.2",
  "ruff>=0.5",
]
vector = [
  "sentence-transformers>=3.0",
]

[project.scripts]
tendertrace = "tendertrace.cli:main"

[tool.setuptools.packages.find]
include = ["tendertrace*"]

[tool.ruff]
line-length = 100
target-version = "py311"
